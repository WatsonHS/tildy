# Starship 1.24.2 defaults (`starship print-config --default`) for the modules the
# importer maps natively or to command modules. Regenerate when Starship changes.

[username]
format = "[$user]($style) in "
style_user = "yellow bold"
style_root = "red bold"
show_always = false
disabled = false

[hostname]
format = "[$ssh_symbol$hostname]($style) in "
style = "green dimmed bold"
ssh_symbol = "🌐 "
ssh_only = true
trim_at = "."
disabled = false

[directory]
format = "[$path]($style)[$read_only]($read_only_style) "
style = "cyan bold"
truncation_length = 3
truncation_symbol = ""
home_symbol = "~"
truncate_to_repo = true
disabled = false
read_only = "🔒"
read_only_style = "red"

[git_branch]
format = "on [$symbol$branch(:$remote_branch)]($style) "
style = "bold purple"
symbol = " "
truncation_symbol = "…"
disabled = false

[git_status]
format = "([\\[$all_status$ahead_behind\\]]($style) )"
style = "red bold"
disabled = false
conflicted = "="
ahead = "⇡"
behind = "⇣"
diverged = "⇕"
untracked = "?"
stashed = "\\$"
modified = "!"
staged = "+"
renamed = "»"
deleted = "✘"
up_to_date = ""

[git_state]
format = "\\([$state( $progress_current/$progress_total)]($style)\\) "
style = "bold yellow"
disabled = false

[nodejs]
format = "via [$symbol($version )]($style)"
style = "bold green"
symbol = " "
disabled = false
version_format = "v${raw}"

[python]
format = "via [${symbol}${pyenv_prefix}(${version} )(\\($virtualenv\\) )]($style)"
style = "yellow bold"
symbol = "🐍 "
disabled = false
version_format = "v${raw}"

[rust]
format = "via [$symbol($version )]($style)"
style = "bold red"
symbol = "🦀 "
disabled = false
version_format = "v${raw}"

[golang]
format = "via [$symbol($version )]($style)"
style = "bold cyan"
symbol = "🐹 "
disabled = false
version_format = "v${raw}"

[java]
format = "via [$symbol($version )]($style)"
style = "red dimmed"
symbol = "☕ "
disabled = false
version_format = "v${raw}"

[c]
format = "via [$symbol($version(-$name) )]($style)"
style = "149 bold"
symbol = "C "
disabled = false
version_format = "v${raw}"

[cpp]
format = "via [$symbol($version(-$name) )]($style)"
style = "149 bold"
symbol = "C++ "
disabled = true
version_format = "v${raw}"

[docker_context]
format = "via [$symbol$context]($style) "
style = "blue bold"
symbol = "🐳 "
disabled = false

[cmd_duration]
format = "took [$duration]($style) "
style = "yellow bold"
min_time = 2000
show_milliseconds = false
disabled = false

[jobs]
format = "[$symbol$number]($style) "
style = "bold blue"
symbol = "✦"
number_threshold = 2
symbol_threshold = 1
disabled = false

[time]
format = "at [$time]($style) "
style = "bold yellow"
use_12hr = false
disabled = true
utc_time_offset = "local"
time_range = "-"

[character]
format = "$symbol "
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
disabled = false

[os]
format = "[$symbol]($style)"
style = "bold white"
disabled = true

[os.symbols]
Android = "🤖 "
DragonFly = "🐉 "
FreeBSD = "😈 "
Illumos = "🐦 "
Linux = "🐧 "
Macos = "🍎 "
NetBSD = "🚩 "
OpenBSD = "🐡 "
Windows = "🪟 "

[conda]
format = "via [$symbol$environment]($style) "
style = "green bold"
symbol = "🅒 "
truncation_length = 1
disabled = false
ignore_base = true

[fill]
style = "bold black"
symbol = "."
disabled = false

[php]
format = "via [$symbol($version )]($style)"
style = "147 bold"
symbol = "🐘 "
disabled = false
version_format = "v${raw}"

[ruby]
format = "via [$symbol($version )]($style)"
style = "bold red"
symbol = "💎 "
disabled = false
version_format = "v${raw}"

[kotlin]
format = "via [$symbol($version )]($style)"
style = "bold blue"
symbol = "🅺 "
disabled = false
version_format = "v${raw}"

[haskell]
format = "via [$symbol($version )]($style)"
style = "bold purple"
symbol = "λ "
disabled = false
version_format = "v${raw}"

[lua]
format = "via [$symbol($version )]($style)"
style = "bold blue"
symbol = "🌙 "
disabled = false
version_format = "v${raw}"

[zig]
format = "via [$symbol($version )]($style)"
style = "bold yellow"
symbol = "↯ "
disabled = false
version_format = "v${raw}"

[swift]
format = "via [$symbol($version )]($style)"
style = "bold 202"
symbol = "🐦 "
disabled = false
version_format = "v${raw}"

[deno]
format = "via [$symbol($version )]($style)"
style = "green bold"
symbol = "🦕 "
disabled = false
version_format = "v${raw}"

[bun]
format = "via [$symbol($version )]($style)"
style = "bold red"
symbol = "🥟 "
disabled = false
version_format = "v${raw}"

[elixir]
format = "via [$symbol($version \\(OTP $otp_version\\) )]($style)"
style = "bold purple"
symbol = "💧 "
disabled = false
version_format = "v${raw}"

[scala]
format = "via [$symbol($version )]($style)"
style = "red bold"
symbol = "🆂 "
disabled = false
version_format = "v${raw}"

[dart]
format = "via [$symbol($version )]($style)"
style = "bold blue"
symbol = "🎯 "
disabled = false
version_format = "v${raw}"

# M2 task E1: modules mapped natively since then (same source).

[package]
format = "is [$symbol$version]($style) "
symbol = "📦 "
style = "208 bold"
display_private = false
disabled = false
version_format = "v${raw}"

[shlvl]
threshold = 2
format = "[$symbol$shlvl]($style) "
symbol = "↕️  "
repeat = false
repeat_offset = 0
style = "bold yellow"
disabled = true

[localip]
ssh_only = true
format = "[$localipv4]($style) "
style = "yellow bold"
disabled = true

[memory_usage]
threshold = 75
format = "via $symbol[$ram( | $swap)]($style) "
style = "white bold dimmed"
symbol = "🐏 "
disabled = true

[sudo]
format = "[as $symbol]($style)"
symbol = "🧙 "
style = "bold blue"
disabled = true

[direnv]
format = "[$symbol$loaded/$allowed]($style) "
symbol = "direnv "
style = "bold bright-yellow"
disabled = true
allowed_msg = "allowed"
not_allowed_msg = "not allowed"
denied_msg = "denied"
loaded_msg = "loaded"
unloaded_msg = "not loaded"

[nix_shell]
format = 'via [$symbol$state( \($name\))]($style) '
symbol = "❄️  "
style = "bold blue"
impure_msg = "impure"
pure_msg = "pure"
unknown_msg = ""
disabled = false
heuristic = false

[shell]
format = "[$indicator]($style) "
style = "white bold"
disabled = true

[status]
format = "[$symbol$status]($style) "
symbol = "❌"
success_symbol = ""
not_executable_symbol = "🚫"
not_found_symbol = "🔍"
sigint_symbol = "🧱"
signal_symbol = "⚡"
style = "bold red"
map_symbol = false
recognize_signal_code = true
disabled = true

[git_commit]
commit_hash_length = 7
format = '[\($hash$tag\)]($style) '
style = "green bold"
only_detached = true
disabled = false
tag_symbol = " 🏷  "
tag_disabled = true
tag_max_candidates = 0

[git_metrics]
added_style = "bold green"
deleted_style = "bold red"
only_nonzero_diffs = true
format = "([+$added]($added_style) )([-$deleted]($deleted_style) )"
disabled = true
ignore_submodules = false
